[build]
  command      = "npm run build"
  publish      = "dist"
  functions    = "netlify/functions"
  edge_functions = "netlify/edge-functions"

[build.environment]
  NODE_VERSION = "18"

# Route /api/transcript → edge function (runs on Cloudflare, not AWS Lambda)
[[edge_functions]]
  path     = "/api/transcript"
  function = "transcript"

[[redirects]]
  from   = "/api/search"
  to     = "/.netlify/functions/search"
  status = 200
  force  = true
