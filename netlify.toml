[build]
  command      = "npm run build"
  publish      = "dist"
  functions    = "netlify/functions"
  edge_functions = "netlify/edge-functions"

[build.environment]
  NODE_VERSION = "20"

# Route /api/transcript → edge function (runs on Cloudflare, not AWS Lambda)
[[edge_functions]]
  path     = "/api/transcript"
  function = "transcript"

[[redirects]]
  from   = "/api/search"
  to     = "/.netlify/functions/search"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/suggest"
  to     = "/.netlify/functions/suggest"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/create-checkout-session"
  to     = "/.netlify/functions/create-checkout-session"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/create-portal-session"
  to     = "/.netlify/functions/create-portal-session"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/stripe-webhook"
  to     = "/.netlify/functions/stripe-webhook"
  status = 200
  force  = true
