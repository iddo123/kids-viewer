[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

# Rewrite /api/transcript → the serverless function (keeps URL consistent with dev)
[[redirects]]
  from   = "/api/transcript"
  to     = "/.netlify/functions/transcript"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/search"
  to     = "/.netlify/functions/search"
  status = 200
  force  = true
